<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pase de Lista QR - Mtra. Monsait Cruz</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  margin: 0;
  padding: 14px;
  font-family: Arial, sans-serif;
  background: #eef2f6;
  text-align: center;
}

.contenedor {
  max-width: 520px;
  margin: auto;
}

.encabezado {
  background: #12385d;
  color: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 14px;
}

.encabezado h1 {
  margin: 0;
  font-size: 25px;
}

.encabezado p {
  margin: 6px 0 0;
}

.tarjeta {
  background: white;
  padding: 17px;
  border-radius: 17px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

select,
input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #bbb;
  margin: 7px 0 12px;
}

label {
  display: block;
  text-align: left;
  font-weight: bold;
}

#reader {
  width: 100%;
  margin-top: 12px;
}

#resultado {
  display: none;
  padding: 18px;
  border-radius: 14px;
  margin-top: 15px;
}

.exito {
  background: #dff4e3;
  color: #12652a;
}

.retardo {
  background: #fff1bd;
  color: #715400;
}

.duplicado {
  background: #fff1bd;
  color: #715400;
}

.error {
  background: #ffe0e0;
  color: #980000;
}

.otrogrupo {
  background: #ffd9d9;
  color: #900000;
  border: 2px solid #c62828;
}

.nombre {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 8px;
}

.dato {
  margin-top: 6px;
}

.contadores {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin-top: 10px;
}

.contador {
  padding: 10px 2px;
  background: #edf2f6;
  border-radius: 10px;
}

.numero {
  font-size: 21px;
  font-weight: bold;
}

.etiqueta {
  font-size: 9px;
}

button {
  border: 0;
  padding: 13px;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}

.botonAzul {
  background: #174f7c;
  color: white;
}

.botonVerde {
  background: #19733d;
  color: white;
}

.botonRojo {
  background: #b4202a;
  color: white;
}

.botonGris {
  background: #e0e5e9;
}

.botonGrande {
  width: 100%;
  margin-top: 8px;
  font-size: 17px;
  font-weight: bold;
}

.botones {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.botones button {
  flex: 1;
  min-width: 90px;
}

.lista {
  text-align: left;
  max-height: 320px;
  overflow-y: auto;
  margin-top: 12px;
}

.alumno {
  padding: 9px 5px;
  border-bottom: 1px solid #ddd;
}

.estadoClase {
  background: #e8f0f8;
  border-radius: 10px;
  padding: 12px;
  margin-top: 5px;
  font-size: 14px;
}

.sesionActiva {
  background: #dff4e3;
  color: #12652a;
  border: 1px solid #94c9a1;
}

.sesionInactiva {
  background: #f5f5f5;
  color: #555;
}

.aviso {
  font-size: 13px;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="contenedor">

<div class="encabezado">
  <h1>📷 Pase de Lista QR</h1>
  <p>COBACH Plantel 234</p>
  <p>Mtra. Monsait Cruz</p>
</div>

<div class="tarjeta">

<label>Materia</label>

<select id="materia" onchange="cambiarMateria()">
  <option value="">Cargando materias...</option>
</select>

<label>Grupo</label>

<select id="grupo" onchange="cambiarGrupo()">
  <option value="">Selecciona primero una materia</option>
</select>

<label>Minutos para considerar retardo</label>

<input
  id="minutosRetardo"
  type="number"
  value="10"
  min="0"
  step="1">

<div id="estadoClase" class="estadoClase sesionInactiva">
  Selecciona la materia y el grupo.
</div>

<button
  id="btnIniciar"
  class="botonVerde botonGrande"
  onclick="iniciarClase()">
  ▶️ Iniciar clase
</button>

<button
  id="btnFinalizar"
  class="botonRojo botonGrande"
  onclick="confirmarFinalizar()"
  style="display:none;">
  ⏹️ Finalizar pase de lista
</button>

<div class="contadores">

  <div class="contador">
    <div class="numero" id="presentes">0</div>
    <div class="etiqueta">PRESENTES</div>
  </div>

  <div class="contador">
    <div class="numero" id="retardos">0</div>
    <div class="etiqueta">RETARDOS</div>
  </div>

  <div class="contador">
    <div class="numero" id="pendientes">0</div>
    <div class="etiqueta">PENDIENTES</div>
  </div>

  <div class="contador">
    <div class="numero" id="faltas">0</div>
    <div class="etiqueta">FALTAS</div>
  </div>

  <div class="contador">
    <div class="numero" id="total">0</div>
    <div class="etiqueta">TOTAL</div>
  </div>

</div>

</div>

<div class="tarjeta">

<h3>📷 Escanear QR</h3>

<p id="textoEscaner">
Inicia una clase antes de escanear.
</p>

<div id="reader"></div>

<div id="resultado"></div>

</div>

<div class="tarjeta">

<h3>✏️ Registro manual</h3>

<input
  id="matriculaManual"
  type="text"
  placeholder="Matrícula del alumno">

<button
  class="botonAzul"
  onclick="registroManual()">
  Registrar asistencia
</button>

</div>

<div class="tarjeta">

<h3>📋 Asistencia de la sesión</h3>

<div class="botones">

<button class="botonGris" onclick="mostrarPresentes()">
  ✅ Presentes
</button>

<button class="botonGris" onclick="mostrarRetardos()">
  🟡 Retardos
</button>

<button class="botonGris" onclick="mostrarPendientes()">
  ○ Pendientes
</button>

<button class="botonGris" onclick="mostrarFaltas()">
  ❌ Faltas
</button>

</div>

<div id="listaAlumnos" class="lista">
  Inicia una clase.
</div>

</div>

</div>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyi9k4fsH2J-dDIS1WxLJQXmb3O1I2t-hp2mAyOJlcS0Szvgs7_b8UMn5aAglqfcMpnog/exec";

let clases = {};
let sesionActual = null;
let resumenActual = null;

let procesando = false;
let ultimoCodigo = "";
let ultimoTiempo = 0;


// =====================================================
// COMUNICACIÓN
// =====================================================

async function llamarScript(parametros) {

  const url =
    URL_SCRIPT +
    "?" +
    new URLSearchParams(parametros).toString();

  const respuesta =
    await fetch(url, {
      method: "GET",
      redirect: "follow",
      cache: "no-store"
    });

  const texto = await respuesta.text();

  return JSON.parse(texto);
}


// =====================================================
// CARGAR CLASES
// =====================================================

async function cargarClases() {

  try {

    const datos =
      await llamarScript({
        accion: "clases"
      });

    if (!datos.ok) {
      alert(datos.mensaje);
      return;
    }

    clases = datos.clases;

    const materiaSelect =
      document.getElementById("materia");

    materiaSelect.innerHTML =
      '<option value="">Selecciona una materia</option>';

    Object.keys(clases).forEach(function(materia) {

      const opcion =
        document.createElement("option");

      opcion.value = materia;
      opcion.textContent = materia;

      materiaSelect.appendChild(opcion);
    });

  } catch (error) {

    alert("No se pudieron cargar las materias.");
  }
}


// =====================================================
// CAMBIO DE MATERIA
// =====================================================

function cambiarMateria() {

  sesionActual = null;
  resumenActual = null;

  const materia =
    document.getElementById("materia").value;

  const grupoSelect =
    document.getElementById("grupo");

  grupoSelect.innerHTML =
    '<option value="">Selecciona un grupo</option>';

  if (!materia || !clases[materia]) {

    limpiarResumen();
    actualizarInterfazSesion();
    return;
  }

  clases[materia].forEach(function(grupo) {

    const opcion =
      document.createElement("option");

    opcion.value = grupo;
    opcion.textContent = grupo;

    grupoSelect.appendChild(opcion);
  });

  limpiarResumen();
  actualizarInterfazSesion();
}


// =====================================================
// CAMBIO DE GRUPO
// =====================================================

async function cambiarGrupo() {

  sesionActual = null;
  resumenActual = null;

  const materia =
    document.getElementById("materia").value;

  const grupo =
    document.getElementById("grupo").value;

  limpiarResumen();

  if (!materia || !grupo) {
    actualizarInterfazSesion();
    return;
  }

  await buscarSesionActiva();
}


// =====================================================
// BUSCAR SESIÓN ACTIVA
// =====================================================

async function buscarSesionActiva() {

  const materia =
    document.getElementById("materia").value;

  const grupo =
    document.getElementById("grupo").value;

  if (!materia || !grupo) {
    return;
  }

  try {

    const datos =
      await llamarScript({
        accion: "sesionActiva",
        materia: materia,
        grupo: grupo
      });

    if (
      datos.ok &&
      datos.activa &&
      datos.sesion
    ) {

      sesionActual = datos.sesion;

      await actualizarResumen();

    } else {

      sesionActual = null;
      limpiarResumen();
    }

    actualizarInterfazSesion();

  } catch (error) {

    sesionActual = null;
    actualizarInterfazSesion();
  }
}


// =====================================================
// INICIAR CLASE
// =====================================================

async function iniciarClase() {

  const materia =
    document.getElementById("materia").value;

  const grupo =
    document.getElementById("grupo").value;

  const minutos =
    document.getElementById("minutosRetardo").value || "10";

  if (!materia || !grupo) {

    alert("Selecciona primero la materia y el grupo.");
    return;
  }

  const aceptar =
    confirm(
      "¿Iniciar esta clase?\n\n" +
      materia +
      "\nGrupo " +
      grupo +
      "\n\n" +
      "Retardo después de " +
      minutos +
      " minutos."
    );

  if (!aceptar) {
    return;
  }

  try {

    const datos =
      await llamarScript({
        accion: "iniciar",
        materia: materia,
        grupo: grupo,
        minutosRetardo: minutos
      });

    if (datos.ok && datos.sesion) {

      sesionActual = datos.sesion;

      mostrarResultado({
        ok: true,
        mensaje: "✅ CLASE INICIADA",
        materia: materia,
        grupo: grupo,
        hora: datos.sesion.horaInicio
      });

    } else if (
      datos.yaExiste &&
      datos.sesion
    ) {

      sesionActual = datos.sesion;

      alert(
        "Ya había una sesión activa para esta clase. Se continuará con esa sesión."
      );

    } else {

      alert(datos.mensaje || "No fue posible iniciar la clase.");
      return;
    }

    await actualizarResumen();
    actualizarInterfazSesion();

  } catch (error) {

    alert("No fue posible iniciar la clase.");
  }
}


// =====================================================
// INTERFAZ DE SESIÓN
// =====================================================

function actualizarInterfazSesion() {

  const estado =
    document.getElementById("estadoClase");

  const btnIniciar =
    document.getElementById("btnIniciar");

  const btnFinalizar =
    document.getElementById("btnFinalizar");

  const textoEscaner =
    document.getElementById("textoEscaner");

  const materia =
    document.getElementById("materia").value;

  const grupo =
    document.getElementById("grupo").value;

  if (sesionActual) {

    estado.className =
      "estadoClase sesionActiva";

    estado.innerHTML =
      "<strong>🟢 SESIÓN ACTIVA</strong><br>" +
      escapar(sesionActual.materia) +
      "<br>Grupo " +
      escapar(sesionActual.grupo) +
      "<br>Retardo después de " +
      escapar(sesionActual.minutosRetardo) +
      " minutos";

    btnIniciar.style.display = "none";
    btnFinalizar.style.display = "block";

    textoEscaner.innerHTML =
      "<strong>Escáner listo.</strong><br>" +
      "Los QR se registrarán en esta sesión.";

  } else {

    estado.className =
      "estadoClase sesionInactiva";

    if (materia && grupo) {

      estado.innerHTML =
        "<strong>Sin sesión activa</strong><br>" +
        escapar(materia) +
        "<br>Grupo " +
        escapar(grupo);

    } else {

      estado.innerHTML =
        "Selecciona la materia y el grupo.";
    }

    btnIniciar.style.display = "block";
    btnFinalizar.style.display = "none";

    textoEscaner.innerHTML =
      "Inicia una clase antes de escanear.";
  }
}


// =====================================================
// RESULTADO
// =====================================================

function mostrarResultado(datos) {

  const caja =
    document.getElementById("resultado");

  caja.style.display = "block";

  if (datos.grupoIncorrecto) {

    caja.className = "otrogrupo";

  } else if (
    datos.ok &&
    datos.estado === "RETARDO"
  ) {

    caja.className = "retardo";

    if (navigator.vibrate) {
      navigator.vibrate([100, 70, 100]);
    }

  } else if (datos.ok) {

    caja.className = "exito";

    if (navigator.vibrate) {
      navigator.vibrate(150);
    }

  } else if (datos.duplicado) {

    caja.className = "duplicado";

    if (navigator.vibrate) {
      navigator.vibrate([100,100,100]);
    }

  } else {

    caja.className = "error";
  }

  let html = "";

  if (datos.nombre) {

    html +=
      '<div class="nombre">' +
      escapar(datos.nombre) +
      '</div>';
  }

  if (datos.grupoIncorrecto) {

    html +=
      '<div class="dato">' +
      'Pertenece a: <strong>' +
      escapar(datos.grupoAlumno) +
      '</strong></div>';

    html +=
      '<div class="dato">' +
      'Clase seleccionada: <strong>' +
      escapar(datos.grupoSeleccionado) +
      '</strong></div>';

  } else if (datos.grupo) {

    html +=
      '<div class="dato">Grupo: ' +
      escapar(datos.grupo) +
      '</div>';
  }

  if (datos.materia) {

    html +=
      '<div class="dato">' +
      escapar(datos.materia) +
      '</div>';
  }

  if (datos.estado) {

    html +=
      '<div class="dato">Estado: <strong>' +
      escapar(datos.estado) +
      '</strong></div>';
  }

  if (datos.hora) {

    html +=
      '<div class="dato">Hora: ' +
      escapar(datos.hora) +
      '</div>';
  }

  html +=
    '<div class="dato"><strong>' +
    escapar(datos.mensaje || "") +
    '</strong></div>';

  caja.innerHTML = html;
}


// =====================================================
// REGISTRAR
// =====================================================

async function registrar(matricula) {

  if (!sesionActual) {

    mostrarResultado({
      ok: false,
      mensaje: "Primero debes iniciar la clase."
    });

    procesando = false;
    return;
  }

  try {

    const datos =
      await llamarScript({
        accion: "registrar",
        matricula: matricula,
        idSesion: sesionActual.idSesion
      });

    mostrarResultado(datos);

    await actualizarResumen();

  } catch (error) {

    mostrarResultado({
      ok: false,
      mensaje: "No se pudo conectar con Google Sheets."
    });

  } finally {

    setTimeout(function() {
      procesando = false;
    }, 1400);
  }
}


// =====================================================
// QR
// =====================================================

function onScanSuccess(decodedText) {

  const ahora = Date.now();

  if (
    procesando ||
    (
      decodedText === ultimoCodigo &&
      ahora - ultimoTiempo < 4000
    )
  ) {
    return;
  }

  procesando = true;
  ultimoCodigo = decodedText.trim();
  ultimoTiempo = ahora;

  registrar(decodedText.trim());
}

function onScanFailure(error) {
}


// =====================================================
// ESCÁNER
// =====================================================

const scanner =
  new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 240,
        height: 240
      },
      rememberLastUsedCamera: true
    },
    false
  );

scanner.render(
  onScanSuccess,
  onScanFailure
);


// =====================================================
// REGISTRO MANUAL
// =====================================================

function registroManual() {

  const campo =
    document.getElementById("matriculaManual");

  const matricula =
    campo.value.trim();

  if (!matricula) {

    alert("Escribe la matrícula del alumno.");
    return;
  }

  if (!sesionActual) {

    alert("Primero debes iniciar la clase.");
    return;
  }

  if (procesando) {
    return;
  }

  procesando = true;
  campo.value = "";

  registrar(matricula);
}


// =====================================================
// RESUMEN
// =====================================================

async function actualizarResumen() {

  if (!sesionActual) {

    limpiarResumen();
    return;
  }

  try {

    const datos =
      await llamarScript({
        accion: "resumen",
        idSesion: sesionActual.idSesion
      });

    if (!datos.ok) {
      return;
    }

    resumenActual = datos;

    document.getElementById("presentes").textContent =
      datos.cantidadPresentes;

    document.getElementById("retardos").textContent =
      datos.cantidadRetardos;

    document.getElementById("pendientes").textContent =
      datos.cantidadPendientes;

    document.getElementById("faltas").textContent =
      datos.cantidadFaltas;

    document.getElementById("total").textContent =
      datos.total;

    mostrarPendientes();

  } catch (error) {

    console.error(error);
  }
}


// =====================================================
// LIMPIAR
// =====================================================

function limpiarResumen() {

  resumenActual = null;

  document.getElementById("presentes").textContent = "0";
  document.getElementById("retardos").textContent = "0";
  document.getElementById("pendientes").textContent = "0";
  document.getElementById("faltas").textContent = "0";
  document.getElementById("total").textContent = "0";

  document.getElementById("listaAlumnos").innerHTML =
    sesionActual
      ? "Cargando..."
      : "Inicia una clase.";
}


// =====================================================
// LISTAS
// =====================================================

function mostrarPresentes() {

  mostrarLista(
    "presentes",
    "✅",
    "Todavía no hay alumnos presentes."
  );
}

function mostrarRetardos() {

  mostrarLista(
    "retardos",
    "🟡",
    "No hay retardos registrados."
  );
}

function mostrarPendientes() {

  mostrarLista(
    "pendientes",
    "○",
    "No hay alumnos pendientes."
  );
}

function mostrarFaltas() {

  mostrarLista(
    "faltas",
    "❌",
    "No hay faltas registradas."
  );
}

function mostrarLista(
  tipo,
  icono,
  mensajeVacio
) {

  const lista =
    document.getElementById("listaAlumnos");

  if (!resumenActual) {

    lista.innerHTML =
      sesionActual
        ? "Cargando..."
        : "Inicia una clase.";

    return;
  }

  const alumnos =
    resumenActual[tipo] || [];

  if (alumnos.length === 0) {

    lista.innerHTML = mensajeVacio;
    return;
  }

  lista.innerHTML =
    alumnos
      .map(function(alumno) {

        return (
          '<div class="alumno">' +
          icono +
          " " +
          escapar(alumno.nombre) +
          '</div>'
        );
      })
      .join("");
}


// =====================================================
// FINALIZAR
// =====================================================

async function confirmarFinalizar() {

  if (!sesionActual) {

    alert("No hay una sesión activa.");
    return;
  }

  const aceptar =
    confirm(
      "¿Finalizar el pase de lista?\n\n" +
      sesionActual.materia +
      "\nGrupo " +
      sesionActual.grupo +
      "\n\n" +
      "Los alumnos pendientes serán marcados como FALTA."
    );

  if (!aceptar) {
    return;
  }

  try {

    const datos =
      await llamarScript({
        accion: "finalizar",
        idSesion: sesionActual.idSesion
      });

    if (!datos.ok) {

      alert(datos.mensaje);
      return;
    }

    alert(
      datos.mensaje +
      "\n\nFaltas registradas: " +
      (datos.faltasAgregadas || 0)
    );

    sesionActual = null;
    resumenActual = null;

    limpiarResumen();
    actualizarInterfazSesion();

  } catch (error) {

    alert("No fue posible finalizar el pase de lista.");
  }
}


// =====================================================
// ESCAPAR TEXTO
// =====================================================

function escapar(texto) {

  const div =
    document.createElement("div");

  div.textContent =
    String(texto || "");

  return div.innerHTML;
}


// =====================================================
// INICIO
// =====================================================

cargarClases();
actualizarInterfazSesion();

</script>

</body>
</html>
